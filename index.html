let current='dashboard',editing=null,searchTerm='';
const load=()=>{try{const x=JSON.parse(localStorage.getItem('agenziapro_db')||'{}');['censimento','acquisizione','incarichi','appuntamenti','opportunita'].forEach(k=>db[k]=Array.isArray(x[k])?x[k]:[]);db.censusOrder=x.censusOrder&&typeof x.censusOrder==='object'?x.censusOrder:{zones:[],addresses:{}};if(!Array.isArray(db.censusOrder.zones))db.censusOrder.zones=[];if(!db.censusOrder.addresses||typeof db.censusOrder.addresses!=='object')db.censusOrder.addresses={}}catch(e){}};
const save=()=>localStorage.setItem('agenziapro_db',JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n!==''&&n!=null&&!isNaN(Number(n))?Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}):'—';
const navHTML=()=>sections.map(s=>`<button data-go="${s.id}" class="${current===s.id?'active':''}"><span class="ico">${s.icon}</span>${s.name}</button>`).join('');
function renderNav(){document.getElementById('sideNav').innerHTML=navHTML();document.getElementById('mobileNav').innerHTML=sections.map(s=>`<button data-go="${s.id}" class="${current===s.id?'active':''}"><span>${s.icon}</span>${s.name}</button>`).join('');}
function go(id){current=id;renderNav();render();}
function header(title,desc,button=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${button}</div></div>`}
function stat(label,value,sub=''){return `<div class="stat"><label>${label}</label><strong>${value}</strong><em>${sub}</em></div>`}
function addButton(type,label='Aggiungi nuovo'){return `<button class="btn primary" onclick="openForm('${type}')">＋ ${label}</button>`}
function records(type){return db[type]||[]}
function filtered(type){let a=records(type);if(!searchTerm)return a;return a.filter(o=>Object.values(o).some(v=>String(v??'').toLowerCase().includes(searchTerm)))}
function thumb(o){return o.photo?`<img src="${o.photo}" alt="">`:'⌂'}
function pill(text){let t=String(text||'');let c=/opportunità|risposto|acquisito|interessato|convertita/i.test(t)?'green':/negativo|non interessato|persa|non risposto/i.test(t)?'red':/informatore|ricontattare|trattativa|seconda visita/i.test(t)?'orange':'blue';return `<span class="pill ${c}">${esc(t||'—')}</span>`}
function actions(type,id){return `<div class="itemactions"><button class="btn small" onclick="openForm('${type}','${id}')">Modifica</button><button class="btn small danger" onclick="removeRecord('${type}','${id}')">Elimina</button></div>`}
function card(type,o){let title=o.immobile||o.titolo||o.indirizzo||o.nominativo||`${o.zona||''} ${o.civico||''}`;let sub=o.indirizzo||[o.zona,o.civico].filter(Boolean).join(' · ');let price=o.prezzo||o.prezzoRichiesto||o.prezzoValutato;return `<article class="itemcard"><div class="thumb">${thumb(o)}</div><div class="itembody"><h3>${esc(title||'Senza titolo')}</h3><div class="muted">${esc(sub||o.tipo||o.tipologia||'')}</div><div class="itemmeta"><span>${price?money(price):esc(o.stato||o.esito||o.operazione||'')}</span><span>${o.mq?esc(o.mq)+' mq':''}</span></div>${type==='censimento'?pill(o.esito):type==='opportunita'?pill(o.stato):type==='appuntamenti'?pill(o.esito):`<span class="pill blue">${esc(o.operazione||o.tipologia||o.stato||'')}</span>`}${actions(type,o.id)}</div></article>`}
function table(type,rows){if(!rows.length)return `<div class="empty"><b>Nessun elemento ancora</b>Usa “Aggiungi” per iniziare a costruire il tuo archivio.</div>`;let cols={censimento:['Zona','Indirizzo','Civico','Nominativi','Esito','Disponibilità'],acquisizione:['Immobile','Indirizzo','Prezzo richiesto','Prezzo valutato','Stato'],incarichi:['Immobile','Indirizzo','Prezzo','Mq','Scadenza'],appuntamenti:['Data','Immobile','Visitatore','Telefono','Esito'],opportunita:['Titolo','Zona','Nominativo','Telefono','Stato']}[type];let keys={censimento:['zona','indirizzo','civico','nominativi','esito','intenzione'],acquisizione:['immobile','indirizzo','prezzoRichiesto','prezzoValutato','stato'],incarichi:['immobile','indirizzo','prezzo','mq','scadenza'],appuntamenti:['data','immobile','nominativo','telefono','esito'],opportunita:['titolo','zona','nominativo','telefono','stato']}[type];return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th>Azioni</th></tr></thead><tbody>${rows.map(o=>`<tr>${keys.map(k=>`<td>${['prezzo','prezzoRichiesto','prezzoValutato'].includes(k)?money(o[k]):k==='esito'||k==='stato'?pill(o[k]):esc(o[k]||'—')}</td>`).join('')}<td><button class="btn small" onclick="openForm('${type}','${o.id}')">Apri / modifica</button></td></tr>`).join('')}</tbody></table></div>`}
function render(){
 const v=document.getElementById('view');
 if(current==='dashboard'){
  let all=Object.values(db).flat(),avg=(()=>{let xs=db.incarichi.filter(x=>Number(x.prezzo)>0&&Number(x.mq)>0).map(x=>Number(x.prezzo)/Number(x.mq));return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):0})();
  v.innerHTML=header('Panoramica','Il tuo spazio di lavoro immobiliare.',`<button class="btn gold" onclick="exportData()">Esporta backup</button><label class="btn" for="backupFile" style="cursor:pointer">Importa backup</label><input id="backupFile" type="file" accept="application/json" hidden onchange="if(this.files[0])importData(this.files[0])">`)
  +`<div class="stats">${stat('Censimenti',db.censimento.length,'Civici registrati')}${stat('Incarichi attivi',db.incarichi.length,'Vendita e locazione')}${stat('Appuntamenti',db.appuntamenti.length,'Visite registrate')}${stat('Prezzo medio incarichi',avg?money(avg)+'/mq':'—','Calcolato dai tuoi incarichi')}</div>`
  +`<div class="cards">${sections.filter(s=>s.id!=='dashboard').map(s=>`<div class="panel"><div class="panelhead"><h3>${s.icon} ${s.name}</h3><span class="pill">${db[s.id]?.length||0}</span></div><div class="panelbody"><p class="muted">${({censimento:'Mappa il territorio, civico per civico.',acquisizione:'Organizza i contatti e le potenziali acquisizioni.',incarichi:'Controlla immobili, prezzi e scadenze.',appuntamenti:'Gestisci visite e potenziali acquirenti.',valutatore:'Stima il valore indicativo di un immobile.',opportunita:'Tieni sotto controllo i contatti promettenti.'})[s.id]}</p><button class="btn small" onclick="go('${s.id}')">Apri sezione →</button></div></div>`).join('')}</div>
  <div style="margin-top:18px" class="panel"><div class="panelhead"><h3>Attività recenti</h3></div>${all.length?`<div class="panelbody muted">Hai registrato ${all.length} elementi. Apri una sezione per consultarli e modificarli.</div>`:`<div class="empty"><b>Benvenuto in AgenziaPro</b>Inizia dal censimento della tua prima zona.</div>`}</div>`;
 } else if(current==='valutatore'){renderValutatore(v)}
 else {
  let type=current,rows=filtered(type);
  const desc={censimento:'Organizza zone, indirizzi e civici. Registra dati catastali e contatti.',acquisizione:'Raccogli le informazioni prima di assumere un incarico.',incarichi:'Schede complete degli immobili affidati all’agenzia.',appuntamenti:'Visite, clienti e relative esigenze di acquisto.',opportunita:'Contatti promettenti da seguire e convertire.'}[type];
  v.innerHTML=header(schemas[type].title,desc,addButton(type,type==='censimento'?'Aggiungi civico':type==='incarichi'?'Nuovo incarico':'Aggiungi'))+
  `<div class="toolbar"><input placeholder="Filtra questa sezione..." oninput="sectionFilter(this.value)" value="${esc(searchTerm)}">${type==='censimento'?'':`<select onchange="sortRecords(this.value)"><option value="">Ordine predefinito</option><option value="az">Nome A–Z</option><option value="date">Data più recente</option></select><button class="btn" onclick="toggleView()">Vista ${window.listMode?'schede':'tabella'}</button>`}</div>`+
  (type==='censimento'?renderCensus(rows):(window.listMode?table(type,rows):`<div class="cards">${rows.length?rows.map(o=>card(type,o)).join(''):`<div class="panel" style="grid-column:1/-1">${table(type,rows)}</div>`}</div>`));
 }
}
window.listMode=false;
function censusOrdered(items, saved){
 const list=[...items],order=Array.isArray(saved)?saved:[];
 return list.sort((a,b)=>{
  const ia=order.indexOf(a),ib=order.indexOf(b);
  if(ia<0&&ib<0)return 0;
  if(ia<0)return 1;
  if(ib<0)return -1;
  return ia-ib;
 });
}
function moveCensusGroup(level,zone,address,delta){
 const rows=db.censimento;
 const clean=v=>String(v||'').trim()||'Non specificata';
 const key=level==='zone'?null:zone;
 const names=level==='zone'
  ? [...new Set(rows.map(o=>clean(o.zona)))]
  : [...new Set(rows.filter(o=>clean(o.zona)===zone).map(o=>clean(o.indirizzo)))];
 const saved=level==='zone'?db.censusOrder.zones:(db.censusOrder.addresses[key]||[]);
 const ordered=censusOrdered(names,saved);
 const current=level==='zone'?zone:address;
 const i=ordered.indexOf(current),j=i+delta;
 if(i<0||j<0||j>=ordered.length)return;
 [ordered[i],ordered[j]]=[ordered[j],ordered[i]];
 if(level==='zone')db.censusOrder.zones=ordered;
 else db.censusOrder.addresses[key]=ordered;
 save();render();
}
function censusMoveButtons(level,zone,address){
 const z=encodeURIComponent(zone||''),a=encodeURIComponent(address||'');
 return `<span class="census-order" onclick="event.stopPropagation()"><button type="button" title="Sposta su" onclick="moveCensusGroup('${level}',decodeURIComponent('${z}'),decodeURIComponent('${a}'),-1)">↑</button><button type="button" title="Sposta giù" onclick="moveCensusGroup('${level}',decodeURIComponent('${z}'),decodeURIComponent('${a}'),1)">↓</button></span>`;
}
function renderCensus(rows){
 if(!rows.length)return `<div class="census-empty"><b>Nessun civico censito</b><p>Inizia aggiungendo un civico: verrà organizzato automaticamente nella sua zona e nel suo indirizzo.</p><button class="btn primary" onclick="openForm('censimento')">＋ Aggiungi il primo civico</button></div>`;
 const clean=v=>String(v||'').trim()||'Non specificata';
 const zones=new Map();
 rows.forEach(o=>{const z=clean(o.zona),a=clean(o.indirizzo),c=clean(o.civico);if(!zones.has(z))zones.set(z,new Map());const addresses=zones.get(z);if(!addresses.has(a))addresses.set(a,[]);addresses.get(a).push({...o,_civic:c});});
 const zoneNames=censusOrdered([...zones.keys()],db.censusOrder.zones);
 const addressCount=[...zones.values()].reduce((n,m)=>n+m.size,0);
 const counts=`<div class="census-summary"><div class="census-count"><strong>${zoneNames.length}</strong><span>Zone</span></div><div class="census-count"><strong>${addressCount}</strong><span>Indirizzi</span></div><div class="census-count"><strong>${rows.length}</strong><span>Civici censiti</span></div></div>`;
 const groups=zoneNames.map((z,zi)=>{
  const addresses=zones.get(z),total=[...addresses.values()].reduce((n,a)=>n+a.length,0);
  const firstZoneRecord=[...addresses.values()].flat().find(o=>o.fotoZona);
  const addressNames=censusOrdered([...addresses.keys()],db.censusOrder.addresses[z]);
  const addressHtml=addressNames.map(a=>{
   const civics=addresses.get(a).sort((x,y)=>x._civic.localeCompare(y._civic,'it',{numeric:true}));
   return `<details class="census-address"><summary><span class="census-address-title"><span>⌖ ${esc(a)}</span>${censusMoveButtons('address',z,a)}</span><span class="pill">${civics.length} ${civics.length===1?'civico':'civici'}</span></summary><div class="census-address-body">${civics.map(o=>`<article class="census-civic"><div style="display:flex;gap:10px;align-items:center"><div class="thumb" style="width:66px;height:56px;flex:0 0 66px;border-radius:7px">${thumb(o)}</div><div style="min-width:0"><h4>Civico ${esc(o._civic)}</h4><div class="muted">${esc(o.tipoUnita||'Tipo non specificato')}</div></div></div><div class="muted" style="margin-top:9px">${o.foglio?`Fg. ${esc(o.foglio)} `:''}${o.particella?`· Part. ${esc(o.particella)} `:''}${o.subalterno?`· Sub. ${esc(o.subalterno)}`:''}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${o.esito?pill(o.esito):''}${o.intenzione?pill(o.intenzione):''}</div><div class="muted" style="margin-top:7px">${esc(o.nominativi||'Nominativi non inseriti')}</div><div class="itemactions"><button class="btn small" onclick="openForm('censimento','${o.id}')">Apri / modifica</button><button class="btn small danger" onclick="removeRecord('censimento','${o.id}')">Elimina</button></div></article>`).join('')}</div></details>`;
  }).join('');
  return `<details class="census-zone" ${zi===0?'open':''}><summary><span class="census-zone-head">${firstZoneRecord?`<img class="census-zone-photo" src="${firstZoneRecord.fotoZona}" alt="">`:`<span class="census-zone-photo" style="display:grid;place-items:center;background:#ffffff18">⌖</span>`}<span class="census-zone-title">▦ ${esc(z)}</span></span><span class="census-zone-tools"><span class="pill">${addresses.size} ${addresses.size===1?'indirizzo':'indirizzi'} · ${total} civici</span>${censusMoveButtons('zone',z,'')}</span></summary><div class="census-zone-body">${addressHtml}<p class="census-photo-note">Per aggiungere o cambiare la foto della zona, modifica un civico e carica una “Foto della zona”.</p></div></details>`;
 }).join('');
 return counts+groups;
}
function sectionFilter(v){searchTerm=v.toLowerCase();render()}
function sortRecords(v){let a=db[current];if(v==='az')a.sort((x,y)=>String(x.immobile||x.titolo||x.zona||'').localeCompare(String(y.immobile||y.titolo||y.zona||''),'it'));if(v==='date')a.sort((x,y)=>String(y.data||y.created||'').localeCompare(String(x.data||x.created||'')));save();render()}
function toggleView(){window.listMode=!window.listMode;render()}
function renderValutatore(v){
 v.innerHTML=header('Valutatore immobiliare','Stima orientativa basata sui parametri che inserisci.')+
 `<div class="panel"><div class="panelhead"><h3>Parametri dell’immobile</h3><span class="pill gold">Stima indicativa</span></div><div class="panelbody"><div class="form" style="padding:0"><div class="field"><label>Zona / indirizzo</label><input id="vZona" placeholder="Es. Catanzaro Lido"></div><div class="field"><label>Tipologia</label><select id="vTipo"><option>Appartamento</option><option>Villa</option><option>Villetta</option><option>Locale commerciale</option><option>Attico</option></select></div><div class="field"><label>Superficie commerciale (mq)</label><input id="vMq" type="number" min="1" value="90"></div><div class="field"><label>Valore medio zona (€/mq)</label><input id="vBase" type="number" min="0" placeholder="Inserisci €/mq"></div><div class="field"><label>Stato manutentivo</label><select id="vStato"><option value="0.85">Da ristrutturare</option><option value="0.95">Da rimodernare</option><option value="1" selected>Buono</option><option value="1.08">Ottimo / ristrutturato</option></select></div><div class="field"><label>Piano</label><select id="vPiano"><option value="1">Piano terra / rialzato</option><option value="1.02">Piano intermedio</option><option value="1.04">Ultimo piano / attico</option></select></div><div class="field"><label>Ascensore</label><select id="vAsc"><option value="1">Presente / non necessario</option><option value=".96">Assente</option></select></div><div class="field"><label>Giardino (mq)</label><input id="vGiardino" type="number" value="0" min="0"></div><div class="field"><label>Terrazza / balcone (mq)</label><input id="vTerrazza" type="number" value="0" min="0"></div><div class="field"><label>Posto auto / garage</label><select id="vAuto"><option value="0">Nessuno</option><option value="5000">Posto auto</option><option value="15000">Garage</option></select></div><div class="field"><label>Esposizione / luminosità</label><select id="vEsposizione"><option value="1">Normale</option><option value="1.03">Buona</option><option value="1.06">Ottima</option></select></div><div class="field"><label>Stato occupazione</label><select id="vOccupato"><option value="1">Libero</option><option value=".95">Locato / occupato</option></select></div><div class="field full"><label>Note e comparabili di mercato</label><textarea id="vNote" placeholder="Inserisci vendite comparabili, caratteristiche particolari, criticità..."></textarea></div></div><div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="calculateValuation()">Calcola fascia di valore</button><button class="btn" onclick="resetValuation()">Azzera</button></div><div id="valuationResult" style="margin-top:18px"></div><p class="muted" style="margin-top:14px">Nota: il risultato è un modello preliminare e non una perizia. I coefficienti sono indicativi e vanno calibrati con comparabili reali, OMI, stato urbanistico-catastale e domanda locale.</p></div></div>`;
}
function calculateValuation(){
 const n=id=>Number(document.getElementById(id).value)||0;
 const mq=n('vMq'),base=n('vBase');if(!mq||!base){document.getElementById('valuationResult').innerHTML='<p class="pill red">Inserisci superficie e valore €/mq della zona.</p>';return}
 let coeff=n('vStato')*n('vPiano')*n('vAsc')*n('vEsposizione')*n('vOccupato');
 let extras=n('vGiardino')*base*.10+n('vTerrazza')*base*.25+n('vAuto');
 let mid=mq*base*coeff+extras,low=mid*.93,high=mid*1.07;
 document.getElementById('valuationResult').innerHTML=`<div class="stats">${stat('Valore minimo',money(low),'Scenario prudenziale')}${stat('Valore centrale',money(mid),'Stima indicativa')}${stat('Valore massimo',money(high),'Scenario favorevole')}${stat('Valore centrale al mq',money(mid/mq),'€/mq indicativi')}</div><button class="btn gold" onclick="saveValuation(${Math.round(low)},${Math.round(mid)},${Math.round(high)})">Salva come acquisizione</button>`;
}
function resetValuation(){document.querySelectorAll('#view input').forEach(x=>{if(x.type==='number')x.value=''});document.getElementById('valuationResult').innerHTML=''}
function saveValuation(low,mid,high){let item={id:crypto.randomUUID(),immobile:document.getElementById('vTipo').value+' · '+(document.getElementById('vZona').value||'Nuova valutazione'),indirizzo:document.getElementById('vZona').value,mq:document.getElementById('vMq').value,prezzoValutato:mid,note:`Fascia stimata: ${money(low)} – ${money(high)}. ${document.getElementById('vNote').value}`,stato:'Da contattare',created:new Date().toISOString()};db.acquisizione.push(item);save();alert('Valutazione salvata tra le acquisizioni.');go('acquisizione')}
function openForm(type,id=null){
 editing={type,id};let schema=schemas[type],obj=id?db[type].find(x=>x.id===id)||{}:{};
 document.getElementById('modalTitle').textContent=(id?'Modifica · ':'Nuovo · ')+schema.title;
 document.getElementById('formFields').innerHTML=schema.fields.map(f=>{
  let [key,label,kind,required,opts]=f,val=obj[key]??'';
  if(kind==='file')return `<div class="field full"><label>${label}</label><input type="file" id="f_${key}" accept="image/*"><div class="photos">${obj[key]?`<img class="photo" src="${obj[key]}" alt="">`:''}</div><small class="muted">Le immagini vengono salvate nel browser. Carica foto leggere (massimo 2 MB ciascuna).</small></div>`;
  if(kind==='select')return `<div class="field"><label>${label}</label><select id="f_${key}" ${required?'required':''}><option value="">Seleziona...</option>${opts.map(x=>`<option ${val===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  if(kind==='textarea')return `<div class="field full"><label>${label}</label><textarea id="f_${key}" ${required?'required':''}>${esc(val)}</textarea></div>`;
  return `<div class="field ${kind==='url'?'full':''}"><label>${label}</label><input id="f_${key}" type="${kind==='file'?'text':kind}" value="${esc(val)}" ${required?'required':''} ${kind==='number'?'min="0"':''}></div>`;
 }).join('');
 document.getElementById('modalback').classList.add('show');
}
function closeModal(){document.getElementById('modalback').classList.remove('show');editing=null}
document.getElementById('recordForm').addEventListener('submit',async e=>{
 e.preventDefault();if(!editing)return;let {type,id}=editing,schema=schemas[type],old=id?db[type].find(x=>x.id===id)||{}:{},obj={...old,id:id||crypto.randomUUID(),created:old.created||new Date().toISOString()};
 for(let f of schema.fields){let [key,label,kind]=f;if(kind==='file')continue;let el=document.getElementById('f_'+key);if(el)obj[key]=el.value.trim()}
 for(let f of schema.fields){let [key,label,kind]=f;if(kind!=='file')continue;const fileInput=document.getElementById('f_'+key);if(fileInput&&fileInput.files.length){let file=fileInput.files[0];if(file.size>2*1024*1024){alert('Foto superiore a 2 MB: scegli un’immagine più leggera.');return}obj[key]=await fileToData(file)}}
 if(type==='censimento'&&!obj.photo&&obj.foto)obj.photo=obj.foto;
 if(type==='incarichi'&&Number(obj.prezzo)>0&&Number(obj.mq)>0)obj.prezzoMq=(Number(obj.prezzo)/Number(obj.mq)).toFixed(2);
 if(id){let i=db[type].findIndex(x=>x.id===id);if(i>=0)db[type][i]=obj}else db[type].unshift(obj);
 try{save()}catch(err){alert('Spazio di archiviazione esaurito. Prova con foto più leggere.');return}
 closeModal();render();
});
function fileToData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function removeRecord(type,id){if(!confirm('Vuoi eliminare definitivamente questo elemento?'))return;db[type]=db[type].filter(x=>x.id!==id);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AgenziaPro-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(file){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);['censimento','acquisizione','incarichi','appuntamenti','opportunita'].forEach(k=>db[k]=Array.isArray(d[k])?d[k]:[]);db.censusOrder=d.censusOrder&&typeof d.censusOrder==='object'?d.censusOrder:{zones:[],addresses:{}};save();render();alert('Backup ripristinato.')}catch(e){alert('File backup non valido.')}};r.readAsText(file)}
document.getElementById('globalSearch').addEventListener('input',e=>{searchTerm=e.target.value.toLowerCase();if(current==='dashboard'){let matches=Object.entries(db).flatMap(([k,a])=>a.filter(o=>Object.values(o).some(x=>String(x??'').toLowerCase().includes(searchTerm))).map(o=>({type:k,o})));let v=document.getElementById('view');if(searchTerm)v.innerHTML=header('Risultati ricerca',`${matches.length} risultati trovati.`)+`<div class="cards">${matches.map(x=>card(x.type,x.o)).join('')||'<div class="empty">Nessun risultato.</div>'}</div>`}else render()});
